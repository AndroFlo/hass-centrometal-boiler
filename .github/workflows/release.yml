name: Release

# Pushing a tag equal to the manifest version (e.g. 0.1.0 or 0.1.0-beta.1) publishes a GitHub
# release, which HACS offers as a version. A tag with a suffix is published as a pre-release,
# shown by HACS only with "Show beta versions".
on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v5"
      - name: Check the manifest version matches the tag
        run: |
          VERSION=$(python3 -c "import json;print(json.load(open('custom_components/centrometal_boiler/manifest.json'))['version'])")
          if [ "$VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match manifest.json version $VERSION"
            exit 1
          fi
      - name: Create release
        uses: "softprops/action-gh-release@v2"
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
